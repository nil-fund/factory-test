# LEGACY / PRE-ACCEPTANCE FIXTURE.
# This preserves the 2026-07-29 trigger-only Factory rerun configuration. It is
# not the Commons eight-stage SC-2 harness and cannot produce current
# acceptance evidence. The historical rerun selected opencode/glm-5.2; that
# selection says nothing about which runtimes are installed or supported now.
# Factory e2e config — historical pipeline chain with agent-agnostic workers.
# Rerun 2026-07-29 (defects G+H fix, rerun 2): opencode/glm-5.2 single worker.
# pool=[opencode], runtime=opencode.
# Defect H: single-worker relaxation means no separation degrade.
# Defect G fix: prompt tells workers to use `gh pr create --repo nil-fund/factory-test` explicitly.
# Historical chain: triage -> spec -> implement -> verify -> review -> halt.
# It lacks Intake, Merge post-merge verification, and Ship, so it is not SC-2.
# Reroute-on-exhaustion so defect A (worker-failure reroute) can fire.
version = 1
poll_every = "10s"

[worker]
runtime = "opencode"
pool = ["opencode"]
sandbox = "worktree"
timeout = "30m"
maximum_timeout = "1h"
max_concurrent = 1

[pipeline]
max_attempts_per_stage = 3
reroute_on_exhaustion = true

[factory]
substrate_path = "/Users/jai/Desktop/substrate"
episodic_path = "/Users/jai/Desktop/episodic"
kb_path = "/Users/jai/Desktop/kb"
gates_path = "/Users/jai/Desktop/gates"
exploration_budget = 0.3

[source]
command = [".factory/sources/github"]

[trigger.triage]
type = "source"
state = "open"
labels = ["factory:triage"]
workflow = ".factory/workflows/triage.md"
timeout = "30m"
pipeline = true

[trigger.spec]
type = "source"
state = "open"
labels = ["factory:spec"]
workflow = ".factory/workflows/spec.md"
timeout = "30m"
pipeline = true

[trigger.implement]
type = "source"
state = "open"
labels = ["factory:ready-to-implement"]
workflow = ".factory/workflows/implement.md"
timeout = "30m"
pipeline = true

[trigger.verify]
type = "source"
state = "open"
labels = ["factory:verify"]
workflow = ".factory/workflows/verify.md"
timeout = "30m"
pipeline = true

[trigger.review]
type = "source"
state = "open"
labels = ["factory:review"]
workflow = ".factory/workflows/review.md"
timeout = "30m"
pipeline = true
