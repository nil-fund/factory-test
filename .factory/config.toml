# Factory e2e config — full SDLC pipeline chain with agent-agnostic workers.
# Rerun 2026-07-28 (defect F fix): pi PRIMARY (opencode credits likely still
# exhausted). pi handles all stages; opencode is fallback for reroute.
# Chain: triage -> spec -> implement -> verify -> review -> halt (D30: a human merges).
# Reroute-on-exhaustion so defect A (worker-failure reroute) can fire if pi
# fails on a stage, rerouting to opencode (if credits allow) or halting as
# needs-human.
version = 1
poll_every = "10s"

[worker]
runtime = "pi"
pool = [{ name = "pi", family = "qwen" }]
sandbox = "worktree"
timeout = "30m"
maximum_timeout = "1h"
max_concurrent = 1

[pipeline]
max_attempts_per_stage = 3
reroute_on_exhaustion = true

[factory]
substrate_path = "/Users/jai/Desktop/substrate"
episodic_path = "/Users/jai/Desktop/episodic"
kb_path = "/Users/jai/Desktop/kb"
gates_path = "/Users/jai/Desktop/gates"
exploration_budget = 0.3

[source]
command = [".factory/sources/github"]

[trigger.triage]
type = "source"
state = "open"
labels = ["factory:triage"]
workflow = ".factory/workflows/triage.md"
timeout = "30m"
pipeline = true

[trigger.spec]
type = "source"
state = "open"
labels = ["factory:spec"]
workflow = ".factory/workflows/spec.md"
timeout = "30m"
pipeline = true

[trigger.implement]
type = "source"
state = "open"
labels = ["factory:ready-to-implement"]
workflow = ".factory/workflows/implement.md"
timeout = "30m"
pipeline = true

[trigger.verify]
type = "source"
state = "open"
labels = ["factory:verify"]
workflow = ".factory/workflows/verify.md"
timeout = "30m"
pipeline = true

[trigger.review]
type = "source"
state = "open"
labels = ["factory:review"]
workflow = ".factory/workflows/review.md"
timeout = "30m"
pipeline = true
