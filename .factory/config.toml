version = 1
poll_every = "10s"

[worker]
runtime = "hermes"
sandbox = "worktree"
timeout = "30m"
maximum_timeout = "1h"
max_concurrent = 1

[source]
command = [".factory/sources/github"]

[trigger.implement]
type = "source"
state = "open"
labels = ["factory:ready-to-implement"]
workflow = ".factory/workflows/implement.md"
timeout = "30m"
